name: build

on:
  push:
    branches: [ master, main, development, '[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ master, main, development, '[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+' ]
  schedule:
    - cron: '30 4 * * *'

jobs:
  phpcs:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "CodeSniffer, PHP ${{ matrix.php }} TYPO3 ${{ matrix.typo3 }}"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        typo3: ["^13.4", "^14.3"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          ini-values: date.timezone="Europe/Copenhagen", opcache.fast_shutdown=0
          tools: composer:v2.2

      - name: Select TYPO3 version
        run: >
          composer require
          typo3/cms-core:${{ matrix.typo3 }}
          typo3/cms-extbase:${{ matrix.typo3 }}
          typo3/cms-fluid:${{ matrix.typo3 }}
          typo3/cms-frontend:${{ matrix.typo3 }}
          typo3/cms-backend:${{ matrix.typo3 }}
          -W --no-update

      - name: Composer install
        uses: ramsey/composer-install@v2
        with:
          composer-options: --ignore-platform-req=php+

      - name: Run phpcs
        run: vendor/bin/phpcs Classes --standard=PSR2

  phpstan:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "PHPStan, PHP ${{ matrix.php }} TYPO3 ${{ matrix.typo3 }}"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        typo3: ["^13.4", "^14.3"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          ini-values: date.timezone="Europe/Copenhagen", opcache.fast_shutdown=0
          tools: composer:v2.2

      - name: Select TYPO3 version
        run: >
          composer require
          typo3/cms-core:${{ matrix.typo3 }}
          typo3/cms-extbase:${{ matrix.typo3 }}
          typo3/cms-fluid:${{ matrix.typo3 }}
          typo3/cms-frontend:${{ matrix.typo3 }}
          typo3/cms-backend:${{ matrix.typo3 }}
          -W --no-update

      - name: Composer install
        uses: ramsey/composer-install@v2
        with:
          composer-options: --ignore-platform-req=php+

      - name: Run phpstan
        run: vendor/bin/phpstan analyze

  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "PHPUnit, PHP ${{ matrix.php }} TYPO3 ${{ matrix.typo3 }}"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        typo3: ["^13.4", "^14.3"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo_sqlite
          ini-values: date.timezone="Europe/Copenhagen", opcache.fast_shutdown=0
          tools: composer:v2.2

      - name: Select TYPO3 version
        run: >
          composer require
          typo3/cms-core:${{ matrix.typo3 }}
          typo3/cms-extbase:${{ matrix.typo3 }}
          typo3/cms-fluid:${{ matrix.typo3 }}
          typo3/cms-frontend:${{ matrix.typo3 }}
          typo3/cms-backend:${{ matrix.typo3 }}
          -W --no-update

      - name: Composer install
        uses: ramsey/composer-install@v2
        with:
          composer-options: --ignore-platform-req=php+

      - name: Restore source Composer manifest
        run: git checkout -- composer.json

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover=build/logs/clover.xml

      - name: Run functional tests
        run: typo3DatabaseDriver=pdo_sqlite vendor/bin/phpunit -c phpunit-functional.xml.dist

      - name: Upload test coverage
        run: |
          composer global require php-coveralls/php-coveralls
          /home/runner/.composer/vendor/bin/php-coveralls --coverage_clover=build/logs/clover.xml -v
        env:
          COVERALLS_PARALLEL: true
          COVERALLS_FLAG_NAME: typo3-${{ matrix.typo3 }}-php-${{ matrix.php }}
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
